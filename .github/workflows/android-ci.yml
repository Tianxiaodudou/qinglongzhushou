name: Android CI

on:
  push:
    branches: [ main, develop, dev-v1 ]
  pull_request:
    branches: [ main, develop, dev-v1 ]

env:
  APP_NAME: 青龙助手
  APP_VERSION: 1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore cached keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: app/qinglong.jks
          key: qinglong-keystore-v1

      - name: Generate keystore (first time)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v \
            -keystore app/qinglong.jks \
            -keyalg RSA -keysize 2048 \
            -validity 36500 \
            -alias qinglong \
            -storepass qinglong123 \
            -keypass qinglong123 \
            -dname "CN=QingLong, OU=QingLong, O=QingLong, L=Beijing, ST=Beijing, C=CN"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Rename APK with version and date
        run: |
          BUILD_DATE=$(date +'%Y%m%d-%H%M')
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${APP_NAME}-v${APP_VERSION}-${BUILD_DATE}.apk"
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "APK_NAME=${APP_NAME}-v${APP_VERSION}-${BUILD_DATE}.apk" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-v1.0
          path: app/build/outputs/apk/debug/*.apk

  release:
    needs: build
    if: github.ref == 'refs/heads/dev-v1' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug-v1.0

      - name: Get version info
        id: version
        run: |
          BUILD_DATE=$(date +'%Y%m%d-%H%M')
          APK_FILE=$(ls *.apk | head -1)
          echo "tag=v${APP_VERSION}-${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "name=${APP_NAME} v${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "apk_file=${APK_FILE}" >> $GITHUB_OUTPUT

      - name: Read changelog
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            # 提取最新版本的更新日志
            python3 -c "
import re
with open('CHANGELOG.md', 'r') as f:
    content = f.read()
# 找到第一个版本标题和第二个版本标题之间的内容
match = re.search(r'## v[\d.]+.*?\n(.*?)(?=\n## |\Z)', content, re.DOTALL)
if match:
    print(match.group(1).strip())
else:
    print('暂无更新日志')
" > /tmp/release_body.txt
          else
            echo "首次发布" > /tmp/release_body.txt
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/release_body.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## ${{ steps.version.outputs.name }}

            ### 更新内容
            ${{ steps.changelog.outputs.body }}

            ### 下载
            - APK 文件: ${{ steps.version.outputs.apk_file }}
            - 编译时间: ${{ steps.version.outputs.tag }}
          files: ${{ steps.version.outputs.apk_file }}
          draft: false
          prerelease: false
