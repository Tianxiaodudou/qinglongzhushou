name: Android CI

on:
  push:
    branches: [ main, develop, dev-v1 ]
  pull_request:
    branches: [ main, develop, dev-v1 ]

env:
  APP_NAME: QingLong
  APP_VERSION: 1.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: QingLong
      APP_VERSION: 1.1.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-build-cache

      - name: Rename APK with build info
        run: |
          BUILD_DATE=$(date +'%Y%m%d-%H%M')
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${APP_NAME}-v${APP_VERSION}-${BUILD_DATE}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-v1.0
          path: app/build/outputs/apk/debug/*.apk

  release:
    needs: build
    if: github.ref == 'refs/heads/dev-v1' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_NAME: QingLong
      APP_VERSION: 1.1.0
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug-v1.0

      - name: Locate APK file
        run: |
          # download-artifact v4 会创建子目录，把文件移出来
          find . -name "*.apk" -type f -exec mv {} . \;
          ls -la *.apk

      - name: Prepare release info
        id: release
        run: |
          echo "=== 当前目录文件 ==="
          ls -la
          APK_FILE=$(ls *.apk 2>/dev/null | head -1)
          if [ -z "$APK_FILE" ]; then
            # 可能在子目录里
            APK_FILE=$(find . -name "*.apk" -type f | head -1)
          fi
          echo "找到APK: $APK_FILE"
          # 从APK文件名中提取时间戳: 青龙助手-v1.0.0-20260522-2245.apk → 20260522-2245
          BUILD_DATE=$(echo "$APK_FILE" | grep -oP '\d{8}-\d{4}')
          TAG="v${APP_VERSION}-${BUILD_DATE}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=${APP_NAME} v${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "apk_file=${APK_FILE}" >> $GITHUB_OUTPUT

      - name: Generate release body
        id: body
        run: |
          cat > /tmp/release_body.md << 'RELEOF'
          ## 青龙助手 v1.1.0

          ### 登录页面重大完善
          登录体验已打磨至非常完好的状态！
          - 🔐 管理已保存的服务器（多服务器支持+四项自动填充）
          - 📱 键盘适配（imePadding，不再遮挡输入框）
          - 🔄 APP重启自动登录获取新token
          - 🔑 覆盖安装数据迁移
          - 🧭 抽屉菜单新增"切换服务器"
          - 📋 增强任务卡片+长按菜单
          - 🐛 修复R8压缩导致服务器列表丢失

          ### 下载
          - APK: app-debug.apk
          - 编译时间: ${{ steps.release.outputs.tag }}
          RELEOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          body_path: /tmp/release_body.md
          files: ${{ steps.release.outputs.apk_file }}
          draft: false
          prerelease: false
