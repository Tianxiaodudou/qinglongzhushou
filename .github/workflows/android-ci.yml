name: Android CI

on:
  push:
    branches: [ main, develop, dev-v1, qianwen ]
  pull_request:
    branches: [ main, develop, dev-v1 ]
  workflow_dispatch:

env:
  APP_NAME: QingLong

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from build.gradle.kts
        id: version
        run: |
          APP_VERSION=$(grep 'versionName' app/build.gradle.kts | grep -oP '"\K[^"]+' | head -1)
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          echo "version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "📦 版本: v${APP_VERSION}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-build-cache

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${APP_NAME}-v${APP_VERSION}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    needs: build
    if: github.ref == 'refs/heads/qianwen'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from build.gradle.kts
        id: version
        run: |
          APP_VERSION=$(grep 'versionName' app/build.gradle.kts | grep -oP '"\K[^"]+' | head -1)
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          echo "version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "📦 版本: v${APP_VERSION}"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug

      - name: Locate APK file
        run: |
          find . -name "*.apk" -type f -exec mv {} . \;
          ls -la *.apk

      - name: Generate release notes
        id: notes
        run: |
          cat > release_body.md << RELEOF
          ## 青龙助手 v${APP_VERSION}

          ## 变更内容
          - 取消编译唯一码规则，使用语义化版本号
          - 开启版本号自动递增机制（versionCode = major*10000 + minor*100 + patch）
          - 编译脚本自动从 build.gradle.kts 读取版本号

          ### 功能概览
          - **定时任务**：视图标签、搜索、分页、批量操作、实时日志弹窗（刷新+自动刷新开关）
          - **订阅管理**：搜索、分页、批量操作
          - **环境变量**：搜索、分页、批量操作
          - **脚本管理**：浏览、编辑、运行
          - **依赖管理**：安装、更新、删除
          - **配置文件**：编辑系统配置文件
          - **应用管理**：查看与管理开放平台应用
          - **通知设置**：管理通知渠道

          ### 系统设置
          - 安全与认证（密码修改、2FA）
          - 开放平台（应用管理、通知设置）
          - 系统日志（日期范围查询、清空）
          - 登录日志（历史记录查看）
          - 依赖设置（镜像源、代理）
          - 其他设置（日志保留、并发数、时区、SSH Key）

          ### 应用设置
          - 外观（深色/浅色/跟随系统）
          - 字体大小（小/默认/大/超大）
          - 服务器管理（添加/编辑/删除/切换）
          - 每页卡片数（定时任务/订阅/环境变量 独立设置）
          - 日志刷新间隔（三组独立）
          - 关于（版本号、服务器地址、青龙面板版本）

          ### 捐赠支持
          导航抽屉底部点击 ❤️ 捐赠，支持微信和支付宝扫码。
          RELEOF

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: v${{ env.APP_VERSION }}
          body_path: release_body.md
          files: '*.apk'
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
