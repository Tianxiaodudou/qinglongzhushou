name: Android CI

on:
  push:
    branches: [ main, develop, dev-v1 ]
  pull_request:
    branches: [ main, develop, dev-v1 ]

env:
  APP_NAME: 青龙助手
  APP_VERSION: 1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: 青龙助手
      APP_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Rename APK with build info
        run: |
          BUILD_DATE=$(date +'%Y%m%d-%H%M')
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${APP_NAME}-v${APP_VERSION}-${BUILD_DATE}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-v1.0
          path: app/build/outputs/apk/debug/*.apk

  release:
    needs: build
    if: github.ref == 'refs/heads/dev-v1' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_NAME: 青龙助手
      APP_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug-v1.0

      - name: Prepare release info
        id: release
        run: |
          echo "=== 当前目录文件 ==="
          ls -la
          APK_FILE=$(ls *.apk 2>/dev/null | head -1)
          if [ -z "$APK_FILE" ]; then
            # 可能在子目录里
            APK_FILE=$(find . -name "*.apk" -type f | head -1)
          fi
          echo "找到APK: $APK_FILE"
          # 从APK文件名中提取时间戳: 青龙助手-v1.0.0-20260522-2245.apk → 20260522-2245
          BUILD_DATE=$(echo "$APK_FILE" | grep -oP '\d{8}-\d{4}')
          TAG="v${APP_VERSION}-${BUILD_DATE}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=${APP_NAME} v${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "apk_file=${APK_FILE}" >> $GITHUB_OUTPUT

      - name: Generate release body
        id: body
        run: |
          cat > /tmp/release_body.md << 'RELEOF'
          ## 青龙助手 v1.0.0

          ### 更新内容
          - 🔐 登录界面（支持 HTTP/HTTPS，服务器配置）
          - 📋 定时任务管理（搜索、标签筛选、批量操作）
          - 🧭 左侧弹出式导航栏（7个模块入口）
          - ⚙️ 全局顶栏
          - 💥 崩溃日志捕获（下次启动时弹窗显示错误详情）
          - 👁️ 密码输入框小眼睛可切换明文显示
          - 🔒 固定应用签名（支持覆盖安装）
          - 📝 APK 文件名带版本号和编译时间
          - 📋 实时运行日志写入 Download/qinglong.txt

          ### 下载
          - APK: app-debug.apk
          - 编译时间: ${{ steps.release.outputs.tag }}
          RELEOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          body_path: /tmp/release_body.md
          files: ${{ steps.release.outputs.apk_file }}
          draft: false
          prerelease: false
