name: Android CI

on:
  push:
    branches: [ main, develop, dev-v1, qianwen ]
  workflow_dispatch:

env:
  APP_NAME: QingLong

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version from source code
        id: version
        run: |
          # 从源码读取版本号（如 1.4.4）
          BASE_VER=$(grep 'versionName' app/build.gradle.kts | grep -oP '"\K[^"]+' | head -1)
          MAJOR=$(echo "$BASE_VER" | cut -d. -f1)
          MINOR=$(echo "$BASE_VER" | cut -d. -f2)
          PATCH=$(echo "$BASE_VER" | cut -d. -f3)

          # 检查 tag 是否已被占用，若占用则递增补丁号
          TAG="v${MAJOR}.${MINOR}.${PATCH}"
          while git ls-remote --tags origin "${TAG}" 2>/dev/null | grep -q "${TAG}$"; do
            PATCH=$((PATCH + 1))
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
            echo "⚠️ tag 已被占用，尝试: ${TAG}"
          done

          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "📦 版本: ${MAJOR}.${MINOR}.${PATCH} | tag: ${TAG}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-build-cache

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/${APP_NAME}-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/debug/*.apk

      - name: Package source code
        run: |
          git archive --format=zip \
            --output=source-v${{ steps.version.outputs.version }}.zip \
            --prefix=qinglong-assistant-v${{ steps.version.outputs.version }}/ \
            HEAD

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: source-*.zip

      - name: Generate changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          cat > release_body.md << EOF
          ## 青龙助手 v${{ steps.version.outputs.version }}

          ### 变更内容
          EOF

          if [ -n "$LAST_TAG" ]; then
            git log "${LAST_TAG}..HEAD" --oneline --no-decorate | while read line; do
              echo "- ${line}" >> release_body.md
            done
          else
            echo "- 初始版本" >> release_body.md
          fi

          echo "" >> release_body.md
          echo "---" >> release_body.md
          echo "提交: $(git rev-parse --short HEAD)" >> release_body.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-body
          path: release_body.md

  release:
    needs: build
    if: github.ref == 'refs/heads/qianwen'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          cp artifacts/app-release/*.apk .
          cp artifacts/source-code/source-*.zip .
          cp artifacts/release-body/release_body.md .
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: v${{ needs.build.outputs.version }}
          body_path: release_body.md
          files: |
            *.apk
            *.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
