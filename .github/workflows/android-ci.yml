name: Android CI

on:
  push:
    branches: [ main, develop, dev-v1, qianwen ]
  workflow_dispatch:

env:
  APP_NAME: QingLong

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          BASE_VER=$(grep 'versionName' app/build.gradle.kts | grep -oP '"\K[^"]+' | head -1)
          RUN_NUM=${{ github.run_number }}
          # tag = 基准版本.构建号，保证唯一不覆盖
          TAG="v${BASE_VER}.${RUN_NUM}"
          echo "version=${BASE_VER}.${RUN_NUM}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "app_version=${BASE_VER}" >> $GITHUB_OUTPUT
          echo "📦 版本: ${BASE_VER} | 标签: ${TAG} | 构建: ${RUN_NUM}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-build-cache

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/${APP_NAME}-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/debug/*.apk

      - name: Package source code
        run: |
          # 创建源代码归档（排除编译产物）
          git archive --format=zip \
            --output=source-v${{ steps.version.outputs.version }}.zip \
            --prefix=qinglong-assistant-${{ steps.version.outputs.version }}/ \
            HEAD

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: source-*.zip

      - name: Generate changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          cat > release_body.md << EOF
          ## 青龙助手 v${{ steps.version.outputs.app_version }}
          **构建**: ${{ steps.version.outputs.version }} | **推送**: $(git log -1 --format=%s HEAD)

          ### 变更内容
          EOF

          if [ -n "$LAST_TAG" ]; then
            git log "${LAST_TAG}..HEAD" --oneline --no-decorate | while read line; do
              echo "- ${line}" >> release_body.md
            done
          else
            echo "- 初始版本" >> release_body.md
          fi

          echo "" >> release_body.md
          echo "---" >> release_body.md
          echo "构建号: ${{ github.run_number }}" >> release_body.md
          echo "提交: $(git rev-parse --short HEAD)" >> release_body.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-body
          path: release_body.md

  release:
    needs: build
    if: github.ref == 'refs/heads/qianwen'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          ls -la artifacts/
          find artifacts/ -type f
          # 将所有文件挪到工作目录
          cp artifacts/app-release/*.apk .
          cp artifacts/source-code/source-*.zip .
          cp artifacts/release-body/release_body.md .
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: v${{ needs.build.outputs.app_version }} 构建${{ github.run_number }}
          body_path: release_body.md
          files: |
            *.apk
            *.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
